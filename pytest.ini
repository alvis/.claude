# repository pytest configuration — `uvx pytest` from the repo root runs the whole suite.
# pytest.ini rather than a root pyproject.toml so `uv run` project discovery, which every
# existing CI job relies on, is left untouched.
[pytest]
# pythonpath and --import-mode are pytest 7+ built-ins; no plugins are required.
minversion = 7.0
testpaths =
    plugins
    scripts
# --import-mode=importlib: seven files share the basename test_contract_footprint.py in
# directories without __init__.py, which the default import mode cannot load together.
# ignored paths are production modules that merely match test_*.py: the scanner RULE
# modules and the Discover template-validator CLI. The Discover validator is ignored
# as a COLLECTION target only — it holds no test functions — and the suite still runs
# it through plugins/essential/tests/test_discover_templates.py, which imports it by
# path. Deleting that wrapper silently un-gates the largest generator in the tree.
addopts =
    --import-mode=importlib
    --ignore=plugins/coding/scripts/scanners
    --ignore=plugins/essential/skills/discover/scripts/test_html_templates.py
# lets tests in scripts/ import their siblings (e.g. analyze_agent_usage) from the root.
pythonpath = scripts
